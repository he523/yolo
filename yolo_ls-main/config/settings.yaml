# =============================================================================
#  实时交通分析系统 — 全局配置文件
#  修改后点击 GUI 中「重新加载 settings.yaml」即时生效（无需重启）
# =============================================================================

# ---------------------------------------------------------------------------
#  系统基础设置
# ---------------------------------------------------------------------------
system:
  device: cuda            # 推理设备: cuda (NVIDIA GPU) | cpu
  log_level: INFO         # 日志级别: DEBUG | INFO | WARNING | ERROR

# ---------------------------------------------------------------------------
#  自适应性能优化（FPS 监控 + 自动降级）
# ---------------------------------------------------------------------------
performance:
  enabled: true
  target_fps: 15.0
  warmup_frames: 45       # 启动 / OCR 加载阶段的预热帧数（不触发降级）
  low_fps_checks: 5       # 连续 N 帧低于目标才升一级（避免频繁跳变）
  dynamic_resolution: true # 负载高时自动降低 detector.imgsz
  frame_skip: 1           # 降级阶段的跳帧倍数（1=不跳, 2=隔帧处理）
  onnx_runtime: false     # [预留] ONNX Runtime 推理加速
  tensorrt: false         # [预留] TensorRT 推理加速

# ---------------------------------------------------------------------------
#  视频输入
# ---------------------------------------------------------------------------
video:
  source: '0'             # 视频源: '0'=默认摄像头 | RTSP 地址 | 视频文件路径
  fps: 15                 # 处理目标帧率
  width: 1280             # 摄像头采集宽度
  height: 720             # 摄像头采集高度
  # resize:               # 注释掉 = 保持原始分辨率，不压缩画质
  # - 640
  # - 640

# ---------------------------------------------------------------------------
#  YOLO 检测器
# ---------------------------------------------------------------------------
detector:
  model_path: models/yolo12n_vehicle.pt  # YOLO 模型权重路径
  confidence: 0.4
  iou_threshold: 0.45     # NMS 的 IoU 阈值 (0~1)
  imgsz: 640              # YOLO 推理输入尺寸（像素），越大越准但越慢
  max_det: 300            # 单帧最大检测目标数
  enable_tiling: false
  tiling_mode: strip      # 切片模式: strip=仅上半幅2块(快) | full=完整网格(慢)
  tiling_interval: 5      # 切片兜底最少间隔帧数
  tiling_grid:            # 切片网格行列数（仅 full 模式生效）
  - 2
  - 2
  tiling_overlap: 0.2     # 切片重叠比例 (0~0.45)
  tiling_min_dets: 10     # 常规检测结果 < 此值时触发切片兜底
  enable_context_detection: true   # 上下文检测（人/交通灯），闯红灯检测依赖此项
  classes:                # 要检测的 COCO 类别 ID
  - 0   # person
  - 1   # bicycle
  - 2   # car
  - 3   # motorcycle
  - 5   # bus

# ---------------------------------------------------------------------------
#  ByteTrack 多目标跟踪
# ---------------------------------------------------------------------------
tracker:
  track_thresh: 0.5       # 高置信度检测阈值，≥此值的检测优先匹配
  track_buffer: 30        # 丢失跟踪的最大保留帧数
  match_thresh: 0.8       # 高置信度检测与跟踪器的 IoU 匹配阈值
  min_box_area: 10        # 最小检测框面积（像素），过小忽略

# ---------------------------------------------------------------------------
#  车辆特征提取
# ---------------------------------------------------------------------------
feature:
  pixel_to_meter: 0.05    # 像素到米的转换系数（需根据场景标定）

# ---------------------------------------------------------------------------
#  违规检测
# ---------------------------------------------------------------------------
violation:
  red_light_enabled: true   # 是否启用闯红灯检测（需配置停止线）
  speeding_enabled: true    # 是否启用超速检测
  wrong_way_enabled: true
  illegal_lane_enabled: true
  expected_flow_direction: north
  lane_change_lateral_px: 80     # 变道判定横向位移阈值（像素）
  lane_change_min_speed_kmh: 15  # 变道最低速度（低于此值不算变道）
  speed_limit: 60
  emergency_distance: 300
  snapshot_dir: data/snapshots  # 违规截图保存目录
  stop_line:
    y: 519
    x_start: 0
    x_end: 1919

# ---------------------------------------------------------------------------
#  交通灯状态检测（HSV 参数可按部署场景调优）
# ---------------------------------------------------------------------------
traffic_light:
  # HSV 检测参数（色调 H / 饱和度 S / 明度 V）
  # 注意：LED 红绿灯在摄像头中通常过曝发白（低饱和度），因此 sat_low/val_low 设置较低，
  # hue 范围已适度放宽以覆盖过曝导致的色偏。
  red_hue_low1: 0
  red_hue_high1: 15
  red_hue_low2: 155
  red_hue_high2: 180
  red_sat_low: 20
  red_val_low: 35
  green_hue_low: 40
  green_hue_high: 90
  green_sat_low: 20
  green_val_low: 35
  yellow_hue_low: 10
  yellow_hue_high: 45
  yellow_sat_low: 20
  yellow_val_low: 35
  # 颜色判定阈值（目标颜色像素占总 ROI 比例低于此值视为 unknown）
  color_threshold: 0.04
  # 竖灯宽高比范围（width/height）
  vertical_aspect_min: 0.25
  vertical_aspect_max: 0.55
  # 故障检测参数
  malfunction_window: 10     # 滑动窗口帧数
  malfunction_unknown_ratio: 0.8  # unknown 占比 ≥ 此值触发故障
  malfunction_change_count: 6     # 窗口内状态变化 ≥ 此值触发故障
  # CNN 分类器（训练后启用，自动替换 HSV 判定）
  use_model: true           # 设为 true 启用 CNN 分类器（需先训练模型）
  model_path: models/traffic_light_cls.pt  # CNN 模型权重路径
  cnn_conf_threshold: 0.6     # CNN 置信度阈值，低于此值回退 HSV
  # 时序平滑参数
  smooth_window: 5            # 平滑窗口帧数，取最近 N 帧多数投票结果
  min_red_frames: 3           # 判定闯红灯所需的最小红灯持续帧数（防止黄变红瞬间误判）
  # CLAHE 预处理开关（过曝场景可关闭以保留原始颜色）
  use_clahe: true
  # 停止线动态重检测（0=关闭，>0=每隔N帧自动重检测，适应相机微小移动）
  stop_line_auto_detect: false
  stop_line_redetect_interval: 300

# ---------------------------------------------------------------------------
#  特种车辆检测（HSV 参数可按场景调优）
# ---------------------------------------------------------------------------
emergency_vehicle:
  # 颜色判定阈值（目标颜色像素占总 ROI 比例低于此值视为不匹配）
  color_threshold: 0.08
  # 警示灯最小面积（像素）
  min_light_area: 100

# ---------------------------------------------------------------------------
#  交警检测（HSV 参数可按场景调优）
# ---------------------------------------------------------------------------
traffic_police:
  # 反光背心颜色 (HSV) — 荧光黄/绿
  vest_hue_low: 25
  vest_hue_high: 45
  vest_sat_low: 100
  vest_val_low: 100
  # 制服颜色 (HSV) — 深蓝/黑
  uniform_hue_low: 100
  uniform_hue_high: 130
  uniform_sat_low: 50
  uniform_val_low: 30
  # 颜色判定阈值
  color_threshold: 0.08
  uniform_threshold: 0.16

# ---------------------------------------------------------------------------
#  车牌识别 (OCR)
# ---------------------------------------------------------------------------
ocr:
  model_path: models/plate_ocr.pt  # CRNN 车牌识别模型路径
  use_gpu: true           # 是否使用 GPU 推理
  enabled: true
  paddle_mobile: true     # 使用 PP-OCRv4 mobile 模型（false=server 大模型）
  interval: 10            # 每 N 帧识别一次（调度器优先未识别车辆）
  min_bbox_height: 40     # 车辆框高度 < 此值时跳过（远处太小识别不到）
  max_vehicles_per_frame: 5  # 每帧最多识别几辆车，避免卡顿

# ---------------------------------------------------------------------------
#  数据库
# ---------------------------------------------------------------------------
database:
  path: data/traffic.db   # SQLite 数据库文件路径
  pool_size: 5            # 连接池大小（>1 启用）
  retention_days: 30      # 数据保留天数，超过自动清理
  max_rows_per_table: 50000  # 单表最大行数
  max_size_mb: 512        # 数据库文件最大大小 (MB)
  cleanup_enabled: true   # 是否启用自动清理
  cleanup_interval_hours: 24  # 自动清理间隔（小时）

# ---------------------------------------------------------------------------
#  GUI 界面
# ---------------------------------------------------------------------------
gui:
  window_title: 实时交通分析系统  # 窗口标题
  window_size:            # 窗口尺寸 (宽 × 高)
  - 1400
  - 900
  theme: dark             # 主题: dark | light
  language: zh_CN         # 界面语言: zh_CN (简体中文) | en (English)

# ---------------------------------------------------------------------------
#  碰撞风险预测 (ST-GAT)
# ---------------------------------------------------------------------------
risk:
  enabled: true
  history_length: 10      # 轨迹历史长度（帧数）
  prediction_horizon: 15  # 预测视野（未来帧数）
  collision_threshold: 150.0  # 碰撞判定距离阈值（像素）
  interaction_distance: 200   # 交互图边距阈值（像素）
  temporal_window: 10     # ST-GAT 时间窗口大小
  interval: 3             # 每 N 帧计算一次风险（降低卡顿）
  max_tracks: 20          # 参与风险计算的最多车辆数（按框面积取前 N）
  stgat_model_path: null  # ST-GAT 模型路径，null 则使用规则模式
  collision_model_path: null  # 碰撞预测模型路径，null 则使用规则模式
  ttc_thresholds:         # TTC (碰撞时间) 风险等级阈值（秒）
    critical: 0.5         #   < 0.5s → 严重
    high: 1.0             #   < 1.0s → 高
    medium: 2.0           #   < 2.0s → 中
    low: 3.0              #   < 3.0s → 低
